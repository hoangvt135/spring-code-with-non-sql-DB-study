# Giúp build ổn định hơn khi mạng chập chờn (thường gặp trên Docker/WSL2):
# tăng số lần thử lại khi tải dependency từ Maven Central bị lỗi kết nối/TLS.
org.gradle.internal.repository.max.tentatives=5
org.gradle.internal.repository.initial.backoff=1000
systemProp.http.socketTimeout=60000
systemProp.http.connectionTimeout=60000
systemProp.https.socketTimeout=60000
systemProp.https.connectionTimeout=60000
